pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm "mic"
}

pcm.mic {
    type plug
    slave.pcm "array"
}

pcm.speaker {
    type plug
    slave.pcm "dmixed"
}

pcm.dmixed {
    type dmix
    ipc_perm 0666
    ipc_key 555555
    slave {
        pcm "hw:CARD=wm8960soundcard,DEV=0"
        format S16_LE
        rate 48000
        channels 2
        period_time 0
        period_size 1024
        buffer_size 8192
    }
}

pcm.array {
    type dsnoop
    ipc_perm 0666
    ipc_key 666666
    slave {
        pcm "hw:CARD=wm8960soundcard,DEV=0"
        format S16_LE
        rate 48000
        channels 2
        period_time 0
        period_size 1024
        buffer_size 8192
    }
}

ctl.!default {
    type hw
    card "wm8960soundcard"
}
