pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm "mic"
}

pcm.mic {
    type plug
    slave.pcm "array"
}

pcm.speaker {
    type plug
    slave.pcm "dmixed"
}

pcm.dmixed {
    type dmix
    slave.pcm "hw:CARD=wm8960soundcard,DEV=0"
    ipc_perm 0666
    ipc_key 555555
}

pcm.array {
    type dsnoop
    ipc_perm 0666
    slave {
        pcm "hw:CARD=wm8960soundcard,DEV=0"
        channels 2
    }
    ipc_key 666666
}

ctl.!default {
    type hw
    card "wm8960soundcard"
}
