# ==== LOA: DAC Speaker MAX98357 ====
pcm.vbot_dac_i2s_speaker {
    type hw
    card sndrpigooglevoi
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "vbot_dac_i2s_speaker"
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 44100
        channels 2
    }
}

ctl.dmixer {
    type hw
    card sndrpigooglevoi
}

pcm.softvol {
    type softvol
    slave.pcm "dmixer"
    control.name "VBot_DAC_Speaker"
    control.card sndrpigooglevoi
}

ctl.softvol {
    type hw
    card sndrpigooglevoi
}

# ==== Mic: Microphone INMP441 ====
pcm.dmic_hw {
    type hw
    card sndrpigooglevoi
    channels 2
    format S32_LE
}

pcm.dmic_sv {
    type softvol
    slave.pcm dmic_hw
    control {
        name "VBot_DAC_Microphone"
        card sndrpigooglevoi
    }
    min_dB -3.0
    max_dB 30.0
}

# ==== Thiết Lập Cấu Hình Mặc Định Loa Và Mic ====
pcm.!default {
    type asym
    #Loa
    #playback.pcm "softvol"
    playback.pcm {
        type plug
        slave.pcm "softvol"
    }
    
    #Mic
    capture.pcm "dmic_sv"
    #capture.pcm {
    #    type plug
    #    slave.pcm "dmic_sv"
    #}
}

ctl.!default {
    type hw
    card sndrpigooglevoi
}

# BEGIN VBOT AEC3 MEDIA BUS
# Shared media mix; speaker/recording defaults and I2S keepalive remain separate.
# A reserved Loopback subdevice avoids the previous VLC-only subdevice 0.
pcm.vbot_aec_media_mix {
    type dmix
    hint.show off
    ipc_key 17513248
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,1"
        format S16_LE
        rate 48000
        channels 2
        period_size 2400
        buffer_size 9600
    }
    bindings { 0 0 1 1 }
}
pcm.vbot_aec_media {
    type plug
    slave.pcm "vbot_aec_media_mix"
    hint.show off
}
# END VBOT AEC3 MEDIA BUS
