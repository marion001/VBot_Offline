# Shared media mix; speaker/recording defaults and I2S keepalive remain separate.
# A reserved Loopback subdevice avoids the previous VLC-only subdevice 0.
pcm.vbot_aec_media_mix {
    type dmix
    hint.show off
    ipc_key 17513248
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,1"
        format S16_LE
        rate 48000
        channels 2
        period_size 2400
        buffer_size 9600
    }
    bindings { 0 0 1 1 }
}
pcm.vbot_aec_media {
    type plug
    slave.pcm "vbot_aec_media_mix"
    hint.show off
}
