<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VBot Assistant - Ngoại tuyến</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827;
           color: #e5e7eb; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .box { text-align: center; padding: 32px; max-width: 420px; }
    img { width: 110px; height: 110px; object-fit: contain; margin-bottom: 18px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #9ca3af; margin: 0 0 22px; line-height: 1.5; }
    button { background: #16a34a; border: 0; color: #fff; font-weight: 600; padding: 11px 26px;
             border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="box">
    <img src="assets/img/icon-512.png" alt="VBot">
    <h1>Không kết nối được tới loa VBot</h1>
    <p>Kiểm tra loa còn bật và cùng mạng Wi-Fi với điện thoại/máy tính của bạn, rồi thử lại.</p>
    <button onclick="location.replace('index.php')">Thử lại</button>
  </div>
</body>
</html>
